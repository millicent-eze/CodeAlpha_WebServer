name: Build and Push Docker Image to Azure

on:
push:
branches:
- main

jobs:
build-and-push:

```
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Login to Azure Container Registry
    uses: docker/login-action@v3
    with:
      registry: millicentdevopsacr.azurecr.io
      username: ${{ secrets.ACR_USERNAME }}
      password: ${{ secrets.ACR_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build -t millicentdevopsacr.azurecr.io/codealpha-webserver:${{ github.sha }} .

  - name: Push Docker Image
    run: |
      docker push millicentdevopsacr.azurecr.io/codealpha-webserver:${{ github.sha }}
```
