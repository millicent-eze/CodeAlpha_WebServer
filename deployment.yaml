apiVersion: apps/v1
kind: Deployment
metadata:
  name: codealpha-webserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codealpha-webserver
  template:
    metadata:
      labels:
        app: codealpha-webserver
    spec:
      containers:
      - name: webserver
        image: codealpha-webserver:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80